services:
  # ----------------------------------------------------------------------------
  # PostgreSQL Database Service
  # ----------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-konkan_db}
      POSTGRES_USER: ${POSTGRES_USER:-konkan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-konkan_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-konkan} -d ${POSTGRES_DB:-konkan_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - konkan_network

  # ----------------------------------------------------------------------------
  # Django Gunicorn Application Service
  # ----------------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      - DEBUG=${DEBUG:-False}
      - SECRET_KEY=${SECRET_KEY:-django-insecure-docker-local-key-replace-for-production}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1,web,nginx,0.0.0.0}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS:-http://localhost,http://127.0.0.1,http://localhost:80,http://localhost:8080}
      - SECURE_SSL_REDIRECT=${SECURE_SSL_REDIRECT:-False}
      - DATABASE_URL=${DATABASE_URL:-postgres://konkan:konkan_password@db:5432/konkan_db}
      - DB_SSL_REQUIRE=${DB_SSL_REQUIRE:-False}
      - GUNICORN_WORKERS=${GUNICORN_WORKERS:-3}
      - GUNICORN_THREADS=${GUNICORN_THREADS:-2}
      - RUN_MIGRATIONS=${RUN_MIGRATIONS:-True}
      - COLLECT_STATIC=${COLLECT_STATIC:-True}
      - AUTO_SEED_DATA=${AUTO_SEED_DATA:-False}
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 45s
    networks:
      - konkan_network

  # ----------------------------------------------------------------------------
  # Nginx Reverse Proxy & Static Caching Service
  # ----------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/var/www/static:ro
      - media_volume:/var/www/media:ro
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost/healthz/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - konkan_network

# ------------------------------------------------------------------------------
# Named Volumes & Networks
# ------------------------------------------------------------------------------
volumes:
  postgres_data:
    driver: local
  static_volume:
    driver: local
  media_volume:
    driver: local

networks:
  konkan_network:
    driver: bridge
