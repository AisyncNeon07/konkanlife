{% extends 'ops/base_ops.html' %}

{% block content %}
<div class="max-w-md mx-auto my-6 sm:my-12 bg-white rounded-3xl border border-rose-200 shadow-xl p-5 sm:p-8 text-center space-y-5 pb-20 md:pb-8">
    <div class="w-14 h-14 rounded-2xl bg-rose-50 text-rose-600 flex items-center justify-center mx-auto text-2xl">
        <i class="fas fa-triangle-exclamation"></i>
    </div>
    <div>
        <h2 class="font-display font-bold text-lg sm:text-xl text-slate-900">Confirm Deletion</h2>
        <p class="text-xs text-slate-500 mt-1">
            Are you sure you want to permanently delete this {{ type }}?
        </p>
        <p class="text-sm font-bold text-slate-900 mt-3 p-3.5 bg-slate-50 rounded-xl border border-slate-200 break-words font-mono">
            "{{ object }}"
        </p>
    </div>

    <form method="post" class="flex flex-col-reverse sm:flex-row items-center justify-center gap-3 pt-2">
        {% csrf_token %}
        <a href="{{ cancel_url }}" class="w-full sm:w-auto text-center px-5 py-3 sm:py-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold min-h-[44px] flex items-center justify-center">
            Cancel
        </a>
        <button type="submit" class="w-full sm:w-auto px-5 py-3 sm:py-2.5 rounded-xl bg-rose-600 hover:bg-rose-700 active:scale-95 text-white text-xs font-bold shadow-sm min-h-[44px] flex items-center justify-center gap-1.5">
            <i class="fas fa-trash-can"></i>
            <span>Yes, Delete Permanently</span>
        </button>
    </form>
</div>
{% endblock %}
