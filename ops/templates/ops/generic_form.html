{% extends 'ops/base_ops.html' %}

{% block content %}
<div class="max-w-2xl mx-auto space-y-5 pb-20 md:pb-0">
    
    <div>
        <a href="{{ back_url|default:'/ops/content/' }}" class="inline-flex items-center gap-1.5 text-xs font-bold text-sky-600 hover:text-sky-700 min-h-[36px] py-1">
            <i class="fas fa-arrow-left text-[11px]"></i> Back
        </a>
        <h1 class="font-display font-black text-xl sm:text-2xl text-slate-900 tracking-tight">{{ page_title }}</h1>
    </div>

    <div class="bg-white rounded-3xl border border-slate-200 shadow-xs p-5 sm:p-8">
        <form method="post" id="genericOpsForm" class="space-y-4">
            {% csrf_token %}
            {% for field in form %}
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1.5">{{ field.label }} {% if field.field.required %}*{% endif %}</label>
                    {{ field }}
                    {% if field.help_text %}
                        <span class="text-[10px] text-slate-400 mt-1 block">{{ field.help_text }}</span>
                    {% endif %}
                    {% if field.errors %}
                        <span class="text-xs text-rose-500 mt-1 block font-medium">{{ field.errors.0 }}</span>
                    {% endif %}
                </div>
            {% endfor %}

            <div class="pt-5 border-t border-slate-200 flex flex-col-reverse sm:flex-row sm:items-center sm:justify-between gap-3">
                <a href="{{ back_url|default:'/ops/content/' }}" class="w-full sm:w-auto text-center py-3 sm:py-2 text-xs font-bold text-slate-500 hover:text-slate-800 border border-slate-200 sm:border-transparent rounded-xl">
                    Cancel
                </a>
                <button type="submit" id="genericSaveBtn" class="w-full sm:w-auto px-6 py-3.5 sm:py-2.5 rounded-xl bg-sky-600 hover:bg-sky-700 active:scale-95 text-white text-xs font-bold shadow-sm transition-all flex items-center justify-center gap-2 min-h-[44px]">
                    <i class="fas fa-check"></i>
                    <span>Save Record</span>
                </button>
            </div>
        </form>
    </div>

</div>

<script>
    const gForm = document.getElementById('genericOpsForm');
    const gBtn = document.getElementById('genericSaveBtn');
    if (gForm && gBtn) {
        gForm.addEventListener('submit', function() {
            gBtn.disabled = true;
            gBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving...';
            gBtn.classList.add('opacity-75');
        });
    }
</script>
{% endblock %}
